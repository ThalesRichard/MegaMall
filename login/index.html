<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar – MegaMall</title>
<script src="../assets/js/layout.js"></script></head>
<body><main><div class="container"><div class="card login-box">
  <h1>Entrar</h1>
  <form id="form-login" class="form" novalidate>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <p id="erro" class="erro" role="alert"></p>
    <button class="btn" type="submit">Entrar na loja</button>
  </form>
</div></div></main>
<script src="../assets/js/login.js"></script></body></html>
